name: proposal-validation

on:
  pull_request:
  push:
    branches:
      - worker12/index-handoff-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate published proposal fixtures
        run: python scripts/validate_proposals.py
      - name: Run proposal validation regressions
        run: python -m unittest discover -s tests -v
      - name: Record validated commit
        run: echo "validated_sha=$GITHUB_SHA"
