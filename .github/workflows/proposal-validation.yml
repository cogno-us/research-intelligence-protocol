name: proposal-validation

on:
  pull_request:
  push:
    branches:
      - worker12/index-handoff-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate published proposal fixtures
        run: python scripts/validate_proposals.py
      - name: Run proposal validation regressions
        run: python -m unittest discover -s tests -v
      - name: Record validated commit
        run: echo "validated_sha=$GITHUB_SHA"
